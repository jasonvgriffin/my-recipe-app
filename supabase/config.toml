# Supabase CLI config (only what this repo deploys). Project ref is passed on the command line / in CI.
project_id = "my-recipe-app"

[functions.mcp]
# The MCP server checks tokens itself (Supabase Auth OAuth tokens, docs/MCP.md); its resource metadata and
# consent endpoints must be reachable without a Supabase JWT, so the gateway's JWT check is off for this function.
verify_jwt = false
import_map = "./functions/mcp/deno.json"

# Hosted project Auth settings the MCP server relies on (applied via the dashboard / Management API, not by CI).
[auth]
site_url = "https://jasonvgriffin.github.io/my-recipe-app"
additional_redirect_urls = ["myrecipeapp://auth", "myrecipeapp://**"]

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

name: Android APK

# Every push / PR builds the APK and uploads it as a CI artifact (proves the build stays green).
# A GitHub Release with the APK is published ONLY for:
#   - a pushed tag matching v* (e.g. v1.0.0), or
#   - a manual run (workflow_dispatch) with `publish: true` and a `tag` (e.g. v1.0.0).
# There are no rolling / incremental releases. The first published APK is v1.0.0 (all SPEC items 1-27 done).
# The APK is signed with the release keystore from repo secrets (ANDROID_KEYSTORE_*; see AGENTS.md).
# Without those secrets it falls back to the debug keystore, and a publish run fails.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the APK'
        type: boolean
        default: false
      tag:
        description: 'Release tag when publishing, e.g. v1.0.0 (must match app.json expo.version)'
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CI: 1
  NODE_VERSION: '22'
  # Build only the ABIs that matter (real phones + x86_64 emulators) to keep CI fast.
  RN_ARCHS: arm64-v8a,x86_64
  # Household sync (spec #25). Public values only (anon key, never service_role). Empty → offline/solo build.
  # Set as repo variable EXPO_PUBLIC_SUPABASE_URL and secret EXPO_PUBLIC_SUPABASE_ANON_KEY.
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish
        id: release
        env:
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          publish=false; tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true; tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
              echo "::error::publish=true requires a tag like v1.0.0"; exit 1
            fi
            publish=true; tag="$INPUT_TAG"
          fi
          if [[ "$publish" == "true" ]]; then
            app_version=$(node -p "require('./app.json').expo.version")
            if [[ "${tag#v}" != "$app_version"* ]]; then
              echo "::error::Tag $tag does not match app.json expo.version ($app_version). Bump app.json first."; exit 1
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish tag=$tag"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci

      - name: Expo prebuild (generate android/)
        # `--non-interactive` is deprecated in current Expo CLI; CI=1 makes prebuild non-interactive.
        run: npx expo prebuild --platform android --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        # Release signing (see AGENTS.md "Signing & secrets"). plugins/with-release-signing.js makes Gradle sign
        # assembleRelease with ANDROID_KEYSTORE_PATH when it is set. Without the secrets (e.g. fork PRs) the APK
        # falls back to the debug keystore; publishing a release without them fails.
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::Release builds must be signed: ANDROID_KEYSTORE_BASE64 secret is missing."; exit 1
            fi
            echo "::warning::No release keystore secret; this APK is signed with the debug keystore."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ env.RN_ARCHS }}

      - name: Verify APK signature
        env:
          SIGNED_WITH_RELEASE_KEY: ${{ steps.keystore.outputs.path != '' }}
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if [[ "$SIGNED_WITH_RELEASE_KEY" == "true" ]] && grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::Expected the release keystore but the APK is debug-signed."; exit 1
          fi
          # Install robustness (v1.0.1): every signature scheme, 16 KB-aligned uncompressed native libs, no stray permissions.
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          schemes=$("$bt/apksigner" verify --verbose "$apk")
          for v in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" "v3 scheme (APK Signature Scheme v3): true"; do
            grep -qF "$v" <<<"$schemes" || { echo "$schemes"; echo "::error::APK is not signed with: $v"; exit 1; }
          done
          "$bt/zipalign" -c -P 16 4 "$apk" || { echo "::error::APK is not zip-aligned (4 bytes, 16 KB pages for .so)"; exit 1; }
          perms=$("$bt/aapt2" dump permissions "$apk")
          echo "$perms"
          if grep -Eq "BLUETOOTH|NEARBY_WIFI_DEVICES|UWB_RANGING|SYSTEM_ALERT_WINDOW|EXTERNAL_STORAGE|EXACT_ALARM|launcher|badge|finsky|c2dm" <<<"$perms"; then
            echo "::error::APK requests a blocked permission (see app.json android.blockedPermissions)"; exit 1
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Collect APK
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          name="my-recipe-app${{ steps.release.outputs.tag && format('-{0}', steps.release.outputs.tag) || '' }}.apk"
          cp "$src" "dist/$name"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-recipe-app-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-recipe-app-apk
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite. Bump the version."; exit 1
          fi
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "My Recipe App $TAG" \
            --generate-notes

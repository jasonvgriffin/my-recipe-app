name: Supabase Edge Functions

# Deploys the remote MCP server (supabase/functions/mcp, docs/MCP.md) to the hosted project.
# Runs on main when the function or its shared code changes, or manually.
#
# Needs: secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token; free), variable SUPABASE_PROJECT_REF.
# Without the token the job only type-checks the function and explains what is missing (it never fails main).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'src/mcp/**'
      - 'src/import/**'
      - 'src/lib/**'
      - 'src/types/**'
      - 'src/entitlements/**'
      - 'src/pantry/isInPantry.ts'
      - 'src/sync/rows.ts'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and bundle the function
        # One self-contained file (app modules from src/ + npm deps), so deployment does not depend on how the
        # CLI collects files outside supabase/.
        run: |
          set -euo pipefail
          (cd supabase/functions/mcp && deno check index.ts)
          mkdir -p .deploy/supabase/functions/mcp
          (cd supabase/functions/mcp && deno bundle --platform deno -o ../../../.deploy/supabase/functions/mcp/index.js index.ts)
          printf '%s\n' 'project_id = "my-recipe-app"' '' '[functions.mcp]' 'verify_jwt = false' 'entrypoint = "./functions/mcp/index.js"' > .deploy/supabase/config.toml
          ls -la .deploy/supabase/functions/mcp
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${REF}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret or SUPABASE_PROJECT_REF variable not set; MCP server not deployed. See docs/MCP.md."
            exit 0
          fi
          cd .deploy
          supabase functions deploy mcp --project-ref "${REF}" --no-verify-jwt --use-api
          echo "MCP server: https://${REF}.supabase.co/functions/v1/mcp"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect to My Recipe App</title>
<!-- OAuth consent page for the remote MCP server (docs/MCP.md). Supabase Auth redirects here with
     ?authorization_id=…; the MCP Edge Function checks the household email code and approves the request. -->
<style>
body{font-family:system-ui,sans-serif;background:#16211A;color:#EDEFEA;display:flex;justify-content:center;padding:32px;margin:0}
main{max-width:420px;width:100%}
input,button{font-size:18px;padding:12px;border-radius:10px;width:100%;box-sizing:border-box;margin-top:8px}
input{background:#22302A;color:#EDEFEA;border:1px solid #3A4A42}
button{background:#7FB77E;color:#10170F;border:0;font-weight:700;margin-top:16px}
button:disabled{opacity:.6}
.err{color:#FF8A80}.info{color:#B8C4BC}.link{background:none;color:#B8C4BC;text-decoration:underline;font-weight:400}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>My Recipe App</h1>
<p>An AI assistant wants to read and add recipes, meal plans and shopping lists in your household.</p>
<p class="info">Sign in with the same email you use for household sharing in the app. Your recipes must be synced.</p>
<p id="msg" class="err" role="alert" hidden></p>
<form id="send">
<label>Email<input id="email" name="email" type="email" autocomplete="email" required autofocus></label>
<button type="submit">Send code</button>
</form>
<form id="verify" hidden>
<p class="info" id="sent"></p>
<label>Code<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
<button type="submit">Connect</button>
<button type="button" class="link" id="again">Use a different email</button>
</form>
</main>
<script>
(function () {
  var MCP = 'https://krqmumdgsfimasjawxqn.supabase.co/functions/v1/mcp';
  var id = new URLSearchParams(location.search).get('authorization_id') || '';
  var $ = function (s) { return document.getElementById(s); };
  var email = '';
  function show(text, info) { var m = $('msg'); m.textContent = text; m.className = info ? 'info' : 'err'; m.hidden = !text; }
  function post(path, body, form) {
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true; show('');
    return fetch(MCP + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { error: 'Something went wrong. Try again.' }; }); })
      .catch(function () { return { error: 'No connection. Check your internet and try again.' }; })
      .finally(function () { btn.disabled = false; });
  }
  if (!id) { show('This page opens from your AI assistant when you connect My Recipe App. Start from there.'); $('send').hidden = true; return; }
  $('send').addEventListener('submit', function (e) {
    e.preventDefault();
    post('/consent/send', { email: $('email').value }, $('send')).then(function (r) {
      if (r.error) return show(r.error);
      email = r.email; $('sent').textContent = 'Code sent to ' + email + '. Check your email.';
      $('send').hidden = true; $('verify').hidden = false; $('code').focus();
    });
  });
  $('verify').addEventListener('submit', function (e) {
    e.preventDefault();
    post('/consent/verify', { email: email, code: $('code').value, authorization_id: id }, $('verify')).then(function (r) {
      if (r.error || !r.redirect_url) return show(r.error || 'Something went wrong. Try again.');
      show('Connected. Returning to your assistant…', true);
      location.replace(r.redirect_url);
    });
  });
  $('again').addEventListener('click', function () { $('verify').hidden = true; $('send').hidden = false; show(''); });
})();
</script>
</body>
</html>
